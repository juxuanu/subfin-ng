name: Release

# Push a tag like v12.1.7.0 (scripts/release.sh does it) to build the plugin, publish it as a GitHub
# release and add it to the plugin repository manifest on main, which Jellyfin reads from
# https://raw.githubusercontent.com/<owner>/<repo>/main/jellyfin-plugin-subfin-manifest.json
# Nothing is published unless the tests (test.yml: unit tests and the conformance suite) pass.
on:
  push:
    tags:
      - 'v*.*.*.*'
  workflow_dispatch:  # run it on an existing tag (choose the tag under "Use workflow from")

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MANIFEST: jellyfin-plugin-subfin-manifest.json
  PUBLISH_DIR: Jellyfin.Plugin.Subsonic/bin/Release/net10.0/publish

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::run this on a version tag like v12.1.7.0 (got '$GITHUB_REF_NAME')"; exit 1
          fi
          META_VERSION=$(jq -r '.version' meta.json)
          if [ "$META_VERSION" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match meta.json version $META_VERSION (use scripts/release.sh)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet publish -c Release Jellyfin.Plugin.Subsonic --nologo

      - name: Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*.*.*.*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then RANGE="${PREV_TAG}..HEAD"; else RANGE="-20"; fi
          {
            echo 'CHANGELOG<<EOF'
            git log --no-merges --format='- %s' $RANGE
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/logo.png
        run: |
          ZIP_NAME="jellyfin-plugin-subfin_${VERSION}.zip"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          WORK_DIR=$(mktemp -d)

          # meta.json inside the zip: the repository's, with this release's details
          jq --arg changelog "$CHANGELOG" --arg imageUrl "$IMAGE_URL" --arg timestamp "$TIMESTAMP" --arg version "$VERSION" \
            '. + {changelog: $changelog, imageUrl: $imageUrl, timestamp: $timestamp, version: $version,
                  status: "Active", autoUpdate: true, assemblies: ["Jellyfin.Plugin.Subsonic.dll"]}' \
            meta.json > "$WORK_DIR/meta.json"
          cp "$PUBLISH_DIR/Jellyfin.Plugin.Subsonic.dll" "$WORK_DIR/"
          (cd "$WORK_DIR" && zip -q -X "$ZIP_NAME" meta.json Jellyfin.Plugin.Subsonic.dll)
          cp "$WORK_DIR/$ZIP_NAME" "./$ZIP_NAME"
          cp meta.json "$RUNNER_TEMP/meta.json"  # for the manifest step, which works on main

          CHECKSUM=$(md5sum "$ZIP_NAME" | awk '{print $1}')
          echo "$ZIP_NAME: md5 $CHECKSUM"
          {
            echo "ZIP_NAME=$ZIP_NAME"
            echo "CHECKSUM=$CHECKSUM"
            echo "TIMESTAMP=$TIMESTAMP"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
          ZIP_NAME: ${{ steps.package.outputs.ZIP_NAME }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ZIP_NAME" --clobber
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --notes "$CHANGELOG" "$ZIP_NAME"
          fi

      - name: Add the release to the manifest on main
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
          CHECKSUM: ${{ steps.package.outputs.CHECKSUM }}
          TIMESTAMP: ${{ steps.package.outputs.TIMESTAMP }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${{ steps.package.outputs.ZIP_NAME }}
          IMAGE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/logo.png
        run: |
          git fetch origin main
          git checkout -B main origin/main
          META="$RUNNER_TEMP/meta.json"

          ENTRY=$(jq -n --arg checksum "$CHECKSUM" --arg changelog "$CHANGELOG" --arg targetAbi "$(jq -r .targetAbi "$META")" \
            --arg sourceUrl "$SOURCE_URL" --arg timestamp "$TIMESTAMP" --arg version "$VERSION" \
            '{version: $version, changelog: $changelog, targetAbi: $targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp: $timestamp}')
          VERSIONS=$( (jq '.[0].versions // []' "$MANIFEST" 2>/dev/null || echo '[]') \
            | jq --argjson new "$ENTRY" '[$new] + [.[] | select(.version != $new.version)]')

          jq --arg imageUrl "$IMAGE_URL" --argjson versions "$VERSIONS" \
            '[{guid, name, description, overview, owner, category, imageUrl: $imageUrl, versions: $versions}]' "$META" > "$MANIFEST"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "release: add v${VERSION} to the plugin manifest [skip ci]"
          git push origin main
